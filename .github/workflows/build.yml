name: Build Release APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Fix main.py filename
        run: |
          echo "=== Before ==="
          ls -la
          shopt -s nullglob
          for f in main*; do
            if [ -f "$f" ] && [ "$f" != "main.py" ]; then
              mv -- "$f" main.py
            fi
          done
          if [ ! -f "main.py" ]; then
            for f in *main*; do
              if [ -f "$f" ]; then
                mv -- "$f" main.py
                break
              fi
            done
          fi
          echo "=== After ==="
          ls -la main.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev wget

      - name: Download Android NDK from Tencent Mirror
        run: |
          mkdir -p /usr/local/lib/android/sdk/ndk/25.2.9519653
          cd /tmp
          wget -q https://mirrors.cloud.tencent.com/AndroidSDK/android-ndk-r25b-linux.zip -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r25b/* /usr/local/lib/android/sdk/ndk/25.2.9519653/

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore mykey.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Maze, OU=Dev, O=Indie, L=City, S=State, C=RU"

      - name: Patch buildozer.spec
        run: |
          grep -q "android.release_keystore" buildozer.spec || echo "android.release_keystore = mykey.keystore" >> buildozer.spec
          grep -q "android.release_keystore_password" buildozer.spec || echo "android.release_keystore_password = android" >> buildozer.spec
          grep -q "android.release_keystore_alias" buildozer.spec || echo "android.release_keystore_alias = mykey" >> buildozer.spec
          grep -q "android.release_keystore_alias_password" buildozer.spec || echo "android.release_keystore_alias_password = android" >> buildozer.spec

      - name: Install buildozer
        run: |
          pip install --upgrade pip wheel
          pip install buildozer cython==0.29.34
          pip install pillow

      - name: Generate app icon
        run: |
          python -c "
          from PIL import Image, ImageDraw
          size = 512
          img = Image.new('RGBA', (size, size), (30, 30, 30, 255))
          d = ImageDraw.Draw(img)
          pad = size // 8
          d.ellipse([pad, pad, size-pad, size-pad], fill=(0, 255, 128, 255))
          r = size // 16
          ef = int(size * 0.15)
          es = int(size * 0.10)
          ex1 = size//2 - es
          ex2 = size//2 + es
          ey = size//2 - ef
          d.ellipse([ex1-r, ey-r, ex1+r, ey+r], fill=(0,0,0,255))
          d.ellipse([ex2-r, ey-r, ex2+r, ey+r], fill=(0,0,0,255))
          img.save('icon.png')
          "

      - name: Pre-accept Android SDK licenses
        run: |
          mkdir -p ~/.android/licenses
          touch ~/.android/repositories.cfg
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\n601085b94cd77f0b54ff86406957099ebe79c4d6\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > ~/.android/licenses/android-sdk-license

      - name: Build APK
        run: |
          buildozer -v android release > buildozer.log 2>&1

      - name: Show last 200 lines
        if: always()
        run: tail -n 200 buildozer.log

      - name: Rename APK
        if: always()
        run: |
          mkdir -p final_apk
          cp bin/*.apk final_apk/maze-release.apk || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: final_apk/maze-release.apk
