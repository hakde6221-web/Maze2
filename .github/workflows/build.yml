name: Build Release APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Fix main.py filename
        shell: bash
        run: |
          echo "=== Before ==="
          ls -la
          shopt -s nullglob
          for f in main*; do
            if [ -f "$f" ] && [ "$f" != "main.py" ]; then
              mv -- "$f" main.py
            fi
          done
          if [ ! -f "main.py" ]; then
            for f in *main*; do
              if [ -f "$f" ]; then
                mv -- "$f" main.py
                break
              fi
            done
          fi
          echo "=== After ==="
          ls -la main.py

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore mykey.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Maze, OU=Dev, O=Indie, L=City, S=State, C=RU"

      - name: Patch buildozer.spec
        run: |
          grep -q "android.release_keystore" buildozer.spec || echo "android.release_keystore = mykey.keystore" >> buildozer.spec
          grep -q "android.release_keystore_password" buildozer.spec || echo "android.release_keystore_password = android" >> buildozer.spec
          grep -q "android.release_keystore_alias" buildozer.spec || echo "android.release_keystore_alias = mykey" >> buildozer.spec
          grep -q "android.release_keystore_alias_password" buildozer.spec || echo "android.release_keystore_alias_password = android" >> buildozer.spec

      # ЭТОТ БЛОК МЫ ДОБАВИЛИ
      - name: Update buildozer
        run: |
          pip install --upgrade buildozer cython==0.29.34 pillow

      - name: Build APK
        run: |
          buildozer -v android release > buildozer.log 2>&1

      - name: Show last 200 lines
        if: always()
        run: tail -n 200 buildozer.log

      - name: Rename APK
        if: always()
        run: |
          mkdir -p final_apk
          cp bin/*.apk final_apk/maze-release.apk || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: final_apk/maze-release.apk
